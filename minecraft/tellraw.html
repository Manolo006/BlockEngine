<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Tellraw Generator</title>
  <link rel="stylesheet" href="../styles/tellraw.css">
  <script src="../script/tellraw.js"></script>
</head>
<body>
  <div id="navbar-container"></div>
<script>
  fetch('/navbar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('navbar-container').innerHTML = data;
    })
    .catch(error => console.error('Errore:', error));
</script>
  <div class="main-layout">
    <div class="editor-container">
      <h2>Tellraw Generator</h2>

      <div class="row">
        <label for="componentType">component type</label>
        <select id="componentType">
          <option value="text" selected>text</option>
          <option value="image">image</option>
          <option value="button">button</option>
        </select>
      </div>

      <div class="row">
        <label for="value">value</label>
        <input type="text" id="value">
        <div class="value-buttons">
          <button type="button" id="addTextBtn" title="Aggiungi testo">+</button>
          <button type="button" id="leftTextBtn" title="Vai a sinistra">&larr;</button>
          <button type="button" id="rightTextBtn" title="Vai a destra">&rarr;</button>
          <button type="button" id="deleteTextBtn" title="Elimina testo">X</button>
        </div>
      </div>

      <div class="row">
        <label for="colorType">color</label>
        <select id="colorType">
          <option value="Unset" selected>Unset</option>
          <option value="dark_red">dark_red</option>
          <option value="red">red</option>
          <option value="gold">gold</option>
          <option value="yellow">yellow</option>
          <option value="dark_green">dark_green</option>
          <option value="green">green</option>
          <option value="aqua">aqua</option>
          <option value="dark_aqua">dark_aqua</option>
          <option value="dark_blue">dark_blue</option>
          <option value="blue">blue</option>
          <option value="dark_purple">dark_purple</option>
          <option value="white">white</option>
          <option value="gray">gray</option>
          <option value="dark_gray">dark_gray</option>
          <option value="black">black</option>
          <option value="hex" >Hex Code</option>
        </select>
        <input type="text" id="colorValue">
      </div>

      <div class="row">
        <label for="shadowColor">shadow_color</label>
        <input type="text" id="shadowColor" >
        <label for="opacity" style="margin-left: 10px;">opacity</label>
        <input type="text" id="opacity" value="255" style="width: 60px;">
      </div>

      <div class="section-title">Stili del testo</div>

      <div class="row">
        <label>Bold</label>
        <div class="radio-group">
          <label><input type="radio" name="bold" checked> Unset</label>
          <label><input type="radio" name="bold"> True</label>
          <label><input type="radio" name="bold"> False</label>
        </div>
      </div>

      <div class="row">
        <label>Italic</label>
        <div class="radio-group">
          <label><input type="radio" name="italic" checked> Unset</label>
          <label><input type="radio" name="italic"> True</label>
          <label><input type="radio" name="italic"> False</label>
        </div>
      </div>

      <div class="row">
        <label>Underlined</label>
        <div class="radio-group">
          <label><input type="radio" name="underlined"  checked> Unset</label>
          <label><input type="radio" name="underlined"> True</label>
          <label><input type="radio" name="underlined"> False</label>
        </div>
      </div>

      <div class="row">
        <label>Strikethrough</label>
        <div class="radio-group">
          <label><input type="radio" name="strikethrough" checked> Unset</label>
          <label><input type="radio" name="strikethrough"> True</label>
          <label><input type="radio" name="strikethrough"> False</label>
        </div>
      </div>

      <div class="row">
        <label>Obfuscated</label>
        <div class="radio-group">
          <label><input type="radio" name="obfuscated" checked> Unset</label>
          <label><input type="radio" name="obfuscated"> True</label>
          <label><input type="radio" name="obfuscated"> False</label>
        </div>
      </div>

      <div class="row">
        <label for="font">font</label>
        <input type="text" id="font">
      </div>

      <div class="row">
        <label for="clickEvent">click_event</label>
        <select id="clickEventType">
          <option value="run_command">run_command</option>
          <option value="copy_to_clipboard">copy_to_clipboard</option>
          <option value="suggest_command">suggest_command</option>
          <option value="open_url">open_url</option>
          <option value="custom">custom</option>
          <option value="show_dialog">show_dialog</option>
        </select>
        <input type="text" id="clickEventValue">
      </div>

      <div class="row">
        <label for="hoverEvent">hover_event</label>
        <select id="hoverEventType">
          <option value="show_text">show_text</option>
          <option value="show_item">show_item</option>
          <option value="show_entity">show_entity</option>
        </select>
        <input type="text" id="hoverEventValue">
      </div>
    </div>
    <div class="output-box">
      <label for="output">Output</label>
      <textarea id="output" readonly></textarea>
      <div id="copied-msg" class="copied-msg">Copiato!</div>
    </div>
  </div>
</body>
</html>
